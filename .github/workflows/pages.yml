name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi sajt
        uses: actions/checkout@v4
      - name: Podesi GitHub Pages
        uses: actions/configure-pages@v5
      - name: Pošalji sajt
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Objavi sajt
        id: deployment
        uses: actions/deploy-pages@v4
